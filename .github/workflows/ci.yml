name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # required for AWS OIDC (ECR push)

env:
  AWS_REGION: ap-south-1
  IMAGE_NAME: loanhub-backend

jobs:
  # ── 1. Build & test ────────────────────────────────────────────────────────
  build-test:
    name: build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Temurin 21 — newer JDKs break Spring Boot 3.2.4
      # (Lombok / Mockito / Spring lambda-converter all fail on JDK 23+)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

      # Upload the jar so later jobs can use it without rebuilding
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ── 2. Checkstyle ──────────────────────────────────────────────────────────
  checkstyle:
    name: checkstyle
    runs-on: ubuntu-latest
    # Non-blocking until the tree is fully clean. Remove continue-on-error to enforce.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Checkstyle
        run: >
          mvn -B -ntp org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check
          -Dcheckstyle.config.location=checkstyle.xml

  # ── 3. OWASP dependency vulnerability scan ─────────────────────────────────
  owasp:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    needs: build-test
    # Non-blocking on first run — NVD feed takes time to download and score.
    # Remove continue-on-error once a baseline suppressions file is established.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP dependency-check
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:9.2.0:check
          -DfailBuildOnCVSS=9
          -DsuppressionFile=owasp-suppressions.xml
          -Dformats=HTML,JSON
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report.*
          retention-days: 7

  # ── 4. SonarCloud code quality analysis ────────────────────────────────────
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for blame/new-code analysis
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SonarCloud scan
        run: >
          mvn -B -ntp verify sonar:sonar
          -Dsonar.projectKey=raj-pro_loanhub-backend
          -Dsonar.organization=raj-pro
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Build Docker image ───────────────────────────────────────────────────
  build-image:
    name: build image
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Export as OCI tar so Trivy can scan it without a registry
          outputs: type=docker,dest=/tmp/backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  # ── 6. Trivy container vulnerability scan ──────────────────────────────────
  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/backend-image.tar

      - name: Trivy scan (CRITICAL/HIGH — fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy scan (full report — informational)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backend-report
          path: trivy-results.sarif
          retention-days: 7

  # ── 7. Push to ECR + update GitOps (main branch only) ──────────────────────
  push-and-deploy:
    name: push to ECR & update GitOps
    runs-on: ubuntu-latest
    needs: [build-test, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/backend-image.tar

      # Authenticate to AWS via OIDC — no static credentials stored in secrets
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        env:
          ECR_URI: ${{ secrets.ECR_BACKEND_URI }}
          TAG: ${{ needs.build-image.outputs.image-tag }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${TAG} ${ECR_URI}:${TAG}
          docker tag ${{ env.IMAGE_NAME }}:${TAG} ${ECR_URI}:latest
          docker push ${ECR_URI}:${TAG}
          docker push ${ECR_URI}:latest

      # Bump the image tag in loanhub-gitops so ArgoCD picks up the new image
      - uses: actions/checkout@v4
        with:
          repository: raj-pro/loanhub-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repo
        env:
          ECR_URI: ${{ secrets.ECR_BACKEND_URI }}
          TAG: ${{ needs.build-image.outputs.image-tag }}
        run: |
          cd gitops
          # Requires kustomize on the runner
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          cd overlays/prod
          ./../../kustomize edit set image backend=${ECR_URI}:${TAG}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "chore(backend): bump image to ${TAG}"
          git push
